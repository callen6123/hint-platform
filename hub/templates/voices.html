

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Available Voices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 24px;
      background: #111;
      color: #eee;
    }
    h1 {
      margin-bottom: 16px;
    }
    .muted {
      color: #aaa;
      font-size: 13px;
    }
    .voice-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .voice-card {
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .voice-name {
      font-weight: 600;
      font-size: 15px;
    }
    .voice-meta {
      font-size: 12px;
      color: #aaa;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #2c6bed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a {
      color: #6aa9ff;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Available Voices</h1>
    <a href="/speak">← Back to Speak</a>
  </div>

  <div class="muted">
    Preview available ElevenLabs voices. Click "Play Demo" to hear the built‑in preview.
  </div>

  <div id="voiceList" class="voice-list"></div>

  <audio id="voicePreviewPlayer" style="display:none;"></audio>

  <script>
    async function api(path) {
      const r = await fetch(path, { credentials: 'same-origin' });
      if (!r.ok) throw new Error("Request failed");
      return r.json();
    }

    const listEl = document.getElementById('voiceList');
    const player = document.getElementById('voicePreviewPlayer');

    function createVoiceCard(v) {
      const card = document.createElement('div');
      card.className = 'voice-card';

      const name = document.createElement('div');
      name.className = 'voice-name';
      name.textContent = v.name || '(Unnamed Voice)';
      card.appendChild(name);

      const meta = document.createElement('div');
      meta.className = 'voice-meta';
      meta.textContent = [
        v.category || '',
        (v.labels && v.labels.accent) ? `Accent: ${v.labels.accent}` : '',
        (v.labels && v.labels.gender) ? `Gender: ${v.labels.gender}` : ''
      ].filter(Boolean).join(' • ');
      card.appendChild(meta);

      const row = document.createElement('div');
      row.className = 'row';

      const btn = document.createElement('button');
      btn.textContent = 'Play Demo';

      if (!v.preview_url) {
        btn.disabled = true;
        btn.textContent = 'No Preview';
      } else {
        btn.addEventListener('click', () => {
          player.src = v.preview_url;
          player.play().catch(() => {});
        });
      }

      row.appendChild(btn);
      card.appendChild(row);

      return card;
    }

    async function loadVoices() {
      try {
        const data = await api('/ui/voices');
        const voices = Array.isArray(data.voices) ? data.voices : [];
        listEl.innerHTML = '';
        voices.forEach(v => {
          listEl.appendChild(createVoiceCard(v));
        });
      } catch (e) {
        listEl.innerHTML = '<div class="muted">Failed to load voices.</div>';
      }
    }

    loadVoices();
  </script>

</body>
</html>
