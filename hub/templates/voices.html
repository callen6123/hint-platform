<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Available Voices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/hub.css" />
  <style>
    .voice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }
    .voice-card {
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      padding: 14px;
    }
    .voice-header {
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .voice-name {
      font-weight: 600;
    }
    .voice-meta {
      opacity: 0.8;
      font-size: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Available Voices</h1>
    <a href="/speak">← Back to Speak</a>
  </div>

  <div class="muted">
    Preview available voices. Click "Play Demo" to hear the built‑in preview.
  </div>

  <div id="voiceList" class="voice-list"></div>

  <audio id="voicePreviewPlayer" style="display:none;"></audio>

  <script>
    async function api(path) {
      const r = await fetch(path, { credentials: 'same-origin' });
      if (!r.ok) throw new Error("Request failed");
      return r.json();
    }

    const listEl = document.getElementById('voiceList');
    const player = document.getElementById('voicePreviewPlayer');

    function createVoiceCard(v) {
      const card = document.createElement('div');
      card.className = 'voice-card';

      const header = document.createElement('div');
      header.className = 'voice-header';

      const name = document.createElement('div');
      name.className = 'voice-name';
      name.textContent = v.name || '(Unnamed Voice)';
      header.appendChild(name);

      const meta = document.createElement('div');
      meta.className = 'voice-meta';
      meta.textContent = [
        v.category || '',
        (v.labels && v.labels.accent) ? `Accent: ${v.labels.accent}` : '',
        (v.labels && v.labels.gender) ? `Gender: ${v.labels.gender}` : ''
      ].filter(Boolean).join(' • ');
      header.appendChild(meta);

      card.appendChild(header);

      const row = document.createElement('div');
      row.className = 'row';

      const btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = 'Play Demo';

      if (!v.preview_url) {
        btn.disabled = true;
        btn.title = 'No preview available for this voice.';
      } else {
        btn.addEventListener('click', () => {
          player.src = v.preview_url;
          player.play().catch(() => {});
        });
      }

      row.appendChild(btn);
      card.appendChild(row);

      return card;
    }

    async function loadVoices() {
      try {
        const data = await api('/ui/voices');
        const voices = Array.isArray(data.voices) ? data.voices : [];
        listEl.innerHTML = '';
        voices.forEach(v => {
          listEl.appendChild(createVoiceCard(v));
        });
      } catch (e) {
        listEl.innerHTML = '<div class="muted">Failed to load voices.</div>';
      }
    }

    loadVoices();
  </script>

</body>
</html>
