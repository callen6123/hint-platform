<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Type & Tell</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hub.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/speak.css') }}" />
</head>
<body>
  <header>
    <div class="row">
      <span class="pill">Type & Tell</span>
      <!-- <nav> -->
        <!-- <a href="/speak"><b>Speak</b></a> -->
        <a href="/dashboard" style="margin-left:10px; padding:8px 12px;">DASHBOARD</a>
      <!-- </nav> -->
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label for="device">Device</label>
        <select id="device"></select>
        <div class="muted" id="deviceHint"></div>
      </div>
      <div>
        <label for="voice">Voice</label>
        <select id="voice"></select>
        <div class="muted" id="voiceHint"></div>
      </div>
    </div>

    <label for="text">Message</label>
    <textarea id="text" placeholder="Type what you want the character to say…"></textarea>
    <div class="help-row">
      <div class="muted"><span id="charCount">0</span> characters</div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="speakBtn">Generate + Play</button>

      <!-- <label class="small" style="margin:0;">
        Cancel mode
        <select id="cancelMode" style="max-width:220px; margin-left:6px;">
          <option value="stop" selected>Stop playback</option>
          <option value="clear_queue">Clear queue</option>
          <option value="stop_and_clear">Stop + clear queue</option>
        </select>
      </label> -->

      <button id="cancelBtn" class="danger">Cancel / Stop</button>
      <!-- <button id="refreshBtn">Refresh devices/voices</button> -->
      <span class="muted" id="status"></span>
    </div>

    <div id="speakProgress" class="progress-panel" aria-live="polite">
      <div class="progress-line">
        <span class="label">Status:</span>
        <span id="speakStatus" class="status">Idle</span>
      </div>
      <div class="progress-line muted" id="speakMeta"></div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h3 style="margin:0 0 8px 0; font-size:14px;">Playback Controls</h3>

      <div class="row" style="align-items:center;">
        <label for="volumeSlider" style="min-width:140px; margin:0;">Volume</label>
        <input id="volumeSlider" type="range" min="0" max="100" step="1" value="80" style="flex:1; margin:0 10px;" />
        <span class="muted small" id="volumeValue" style="min-width:44px; text-align:right;">80%</span>
        <span class="muted small" id="volumeStatus" style="margin-left:10px;"></span>
      </div>

      <div class="muted small" style="margin-top:6px;">
        Adjusts the device’s output volume.
      </div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h3 style="margin:0 0 8px 0; font-size:14px;">Saved phrases</h3>
      <div class="row">
        <input id="phraseLabel" type="text" placeholder="Label (e.g., Hint 1)" />
        <button id="savePhraseBtn">Save phrase</button>
        <button id="deletePhraseBtn" class="danger" disabled>Delete selected</button>
        <span class="muted small" id="phraseStatus"></span>
      </div>
      <div class="muted small" style="margin-top:6px;">Click a phrase to load its text. Save overwrites if a phrase is selected.</div>
      <div class="phrases" id="phrases"></div>
    </div>
  </div>

  <!-- <div class="log" id="log"></div> -->

  <script defer src="{{ url_for('static', filename='js/speak.js') }}"></script>
</body>
</html>
